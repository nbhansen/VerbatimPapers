# VerbatimPapers - Configuration
# Copy this file to config.yaml and customize it

# TTS Configuration
tts:
  # Engine selection: "piper" (local, recommended) or "gemini" (cloud)
  engine: "piper"

  # Rate limiting and concurrency
  concurrent_requests: 4
  request_delay_seconds: 2.0

  # Piper TTS Settings (Local)
  piper:
    # Voice model to use
    # Common options: en_US-lessac-medium, en_GB-alba-medium, en_US-ryan-high
    model_name: "en_US-lessac-medium"

    # Directory where voice models are downloaded and stored
    download_dir: "piper_models"

    # GPU acceleration (not yet implemented, has no effect)
    use_gpu: false

    # Speech speed (1.0 = normal, 0.8 = slower, 1.2 = faster)
    length_scale: 1.0

    # Pause inserted after every sentence, in seconds. This is the main cadence
    # control - raise it for a slower, more deliberate read.
    #
    # Applied when the audio is assembled rather than by the engine, so it is
    # honoured identically between sentences and at chunk boundaries, and the
    # read-along timeline accounts for it exactly.
    sentence_silence: 0.2

    # Synthesis variability. noise_scale affects tone, noise_w affects the
    # timing/pronunciation of individual phonemes.
    noise_scale: 0.667
    noise_w: 0.8

  # Gemini TTS Settings (Cloud)
  gemini:
    voice_name: "Kore"
    model_name: "gemini-2.5-flash"
    max_retries: 3

    # Delivery direction, prefixed to the text. Gemini takes tone and pacing as
    # natural language rather than SSML, so this is its only prosody control.
    # Omit for the built-in academic-reading default; set to "" to send text bare.
    # style_prompt: "Read this slowly and clearly, pausing between sections."

# Text Processing Pipeline
text_processing:
  # Use LLM to clean and fix OCR errors, and repair punctuation damaged by PDF
  # extraction. Speech rhythm comes from correct punctuation, so this matters
  # for cadence as well as accuracy.
  enable_text_cleaning: true

  # Convert academic text to plain English (optional)
  enable_plain_english_conversion: false

  # Chunk sizes for processing
  llm_chunk_size: 50000
  audio_target_chunk_size: 3000

# File Storage Settings
files:
  upload_folder: "uploads"
  audio_folder: "audio_outputs"
  max_file_size_mb: 100

  # Auto-cleanup settings
  cleanup:
    enabled: true
    max_file_age_hours: 24.0        # Delete outputs and orphaned uploads older than 24 hours
    auto_cleanup_interval_hours: 6.0 # Run cleanup every 6 hours

# Performance Tuning
performance:
  enable_async_audio: true
  # Number of audio chunks to generate in parallel
  # Higher = faster but more CPU/RAM usage
  audio_concurrent_chunks: 4

# Web Server Settings
app:
  debug: true
  host: "127.0.0.1"
  port: 5000

# Admin Endpoints (/admin/*)
# Disabled by default: they expose filesystem details and can delete generated
# audio. Only enable on a trusted host; set an admin_token under secrets if the
# server is reachable by others (send it as the X-Admin-Token header).
admin:
  enabled: false

# Secrets and API Keys
secrets:
  # Required for Text Cleaning and Gemini TTS
  # Get one at: https://aistudio.google.com/app/apikey
  google_ai_api_key: "YOUR_GOOGLE_AI_API_KEY"
  # Optional: required X-Admin-Token header value for /admin/* when set
  # admin_token: "choose-a-long-random-string"

# OCR Settings (Tesseract)
ocr:
  dpi: 300
  language: "eng"
  threshold: 180

# LLM Provider Settings (for text cleaning)
llm:
  model_name: "gemini-2.5-flash"
  concurrent_requests: 3
  request_delay_seconds: 0.5

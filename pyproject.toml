[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["application", "domain", "infrastructure"]

[project]
name = "verbatimpapers"
version = "0.1.0"
description = "Convert PDF documents to audio files with TTS engines"
authors = [{name = "Nicolai Hansen", email = "nbhansen@gmail.com"}]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "Flask>=3.1.1",
    "numpy>=2.2.6",
    "pdf2image>=1.17.0",
    "pdfplumber>=0.11.6",
    "pydub>=0.25.1",
    "pytesseract>=0.3.13",
    "python-dotenv>=1.1.0",
    "google-genai>=1.21.0",
    "aiofiles>=24.1.0",
    "nest-asyncio>=1.6.0",
    "PyYAML>=6.0.1",
    "piper-tts>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.0",
    "pytest-cov>=6.1.1",
    "pytest-benchmark>=5.1.0",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.1.9",
    "mypy>=1.8.0",
    "bandit>=1.7.5",
    "pre-commit>=3.6.0",
    "types-PyYAML>=6.0.12",
]

[tool.ruff]
# Fast, comprehensive Python linting
line-length = 120
target-version = "py312"
extend-exclude = [
    ".venv",
    "uploads",
    "audio_outputs",
    "__pycache__",
]

[tool.ruff.lint]
# Enable comprehensive rule sets for high code quality
select = [
    # Pycodestyle
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings

    # Pyflakes
    "F",     # pyflakes

    # Code quality and bug prevention
    "B",     # flake8-bugbear (common bugs and design problems)
    "C4",    # flake8-comprehensions (better list/dict/set comprehensions)
    "PIE",   # flake8-pie (unnecessary code patterns)
    "SIM",   # flake8-simplify (code simplification suggestions)
    "RUF",   # Ruff-specific rules
    "G",     # flake8-logging-format (lazy %-style log arguments)

    # Security
    "S",     # flake8-bandit (security testing)

    # Complexity
    "C90",   # mccabe complexity

    # Modern Python
    "UP",    # pyupgrade (modern Python idioms)
    "PTH",   # flake8-use-pathlib (prefer pathlib over os.path)

    # Import sorting and organization
    "I",     # isort (import sorting)

    # Documentation
    "D",     # pydocstyle (docstring conventions)

    # Type annotations
    "ANN",   # flake8-annotations (missing type annotations)

    # Async best practices
    "ASYNC", # flake8-async (async/await best practices)

    # Testing
    "PT",    # flake8-pytest-style (pytest best practices)
]

ignore = [
    # Documentation - allow missing docstrings in some cases
    "D100",  # Missing docstring in public module
    "D104",  # Missing docstring in public package
    "D107",  # Missing docstring in __init__

    # Type annotations - gradual adoption
    "ANN204", # Missing return type annotation for special method

    # Security - false positives for our use case
    "S101",   # Use of assert (OK in tests)
    "S603",   # subprocess call (we use subprocess intentionally)
    "S607",   # Starting a process with a partial executable path

    # Complexity - allow some complexity in domain logic
    "C901",   # Complex function (we'll monitor separately)

    # Style preferences - if/elif chains more readable than dicts for multiline strings
    "SIM116", # Use dict instead of consecutive if statements

    # Async - pathlib in async is fine for our use case (not using trio/anyio)
    "ASYNC240", # Async functions should not use pathlib
]

[tool.ruff.lint.per-file-ignores]
# Test files can have additional flexibility
"tests/**/*.py" = [
    "S101",   # Assert statements are expected in tests
    "S108",   # Probable insecure usage of temp files (test paths are fine)
    "D103",   # Missing docstring in public function (test functions)
    "ANN001", # Missing type annotation for function argument
    "ANN201", # Missing return type annotation for public function
    "PT017",  # Assertion on exception in except block (acceptable in tests)
    "PT018",  # Assertion should be broken down (acceptable in tests)
    "S110",   # try-except-pass (acceptable in tests)
    "SIM117", # Nested with statements (acceptable in tests)
    "PTH123", # open() vs Path.open() (acceptable in tests)
    "RUF059", # Unused unpacked variable (acceptable in tests)
    "F841",   # Local variable assigned but never used (acceptable in tests)
    "RUF043", # Pattern metacharacters in match= (acceptable in tests)
]

# PDF pipeline test has trailing spaces in PDF binary content literals
"tests/integration/test_pdf_to_audio_pipeline.py" = [
    "W291",   # Trailing whitespace in PDF xref table content
]

# Infrastructure files - allow secure URL operations
"infrastructure/tts/piper_tts_provider.py" = [
    "S310",   # Allow urllib for secure HTTPS downloads from trusted sources
]

# Config files and scripts
"*.py" = ["D100"]  # Module docstrings optional for scripts

[tool.ruff.lint.mccabe]
max-complexity = 10  # Target: average <5, but allow up to 10

[tool.ruff.lint.isort]
known-first-party = ["application", "domain", "infrastructure"]
force-sort-within-sections = true

[tool.ruff.lint.pydocstyle]
convention = "google"  # Google-style docstrings

[tool.mypy]
# Strict type checking for better code quality
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
implicit_reexport = false
strict_equality = true

# Allow some flexibility for external dependencies
ignore_missing_imports = true
exclude = ["venv/"]

# Module-specific overrides
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false


[tool.bandit]
# Security vulnerability scanning
exclude_dirs = ["tests", ".venv"]
skips = [
    "B101",  # assert_used (OK in tests and development)
    "B603",  # subprocess_without_shell_equals_true (we use subprocess intentionally)
]

[tool.pytest.ini_options]
# Enhanced test configuration
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = [
    "--verbose",
    "--tb=short",
    "--strict-markers",
    "--strict-config",
    "--durations=10",
]

markers = [
    "unit: Fast unit tests with no external dependencies",
    "integration: Integration tests with mocked external services",
    "external: Tests requiring real external services (manual)",
    "slow: Tests taking more than 5 seconds",
    "benchmark: Performance benchmark tests",
]

filterwarnings = [
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
    "ignore::pytest.PytestUnraisableExceptionWarning",
]

[tool.coverage.run]
source = ["."]
omit = [
    ".venv/*",
    "venv/*",
    "tests/*",
    "*/test_*.py",
    "uploads/*",
    "audio_outputs/*",
    "app.py",  # dev-server entry script, not exercised by tests
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

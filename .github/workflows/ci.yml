name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install  # version from .python-version

      # Cached: the Azure apt mirror regularly stalls past any reasonable timeout
      - name: Install system dependencies
        timeout-minutes: 10
        uses: awalsh128/cache-apt-pkgs-action@v1.4.3
        with:
          packages: tesseract-ocr ffmpeg espeak-ng
          version: 1

      - name: Install dependencies
        run: uv sync --extra dev

      # The real-conversion integration test speaks with this voice
      - name: Cache Piper voice model
        uses: actions/cache@v4
        with:
          path: piper_models
          key: piper-voice-en_US-lessac-medium

      - name: Lint with ruff
        run: uv run ruff check .

      - name: Check formatting with ruff
        run: uv run ruff format --check .

      - name: Type check with mypy
        run: uv run mypy .

      - name: Run unit tests
        run: uv run python -m pytest tests/unit/ -v

      - name: Run infrastructure tests
        run: uv run python -m pytest tests/infrastructure/ -v

      - name: Run integration tests
        run: uv run python -m pytest tests/integration/ -v
